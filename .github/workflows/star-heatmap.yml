name: Profile assets

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/scripts/**", ".github/featured.json", ".github/workflows/star-heatmap.yml"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render star heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/star_heatmap.py --user "${{ github.repository_owner }}" --out assets/star-heatmap.svg --accent "#ff7b72"
      - name: Render featured projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/featured_projects.py --user "${{ github.repository_owner }}" --accent "#ff7b72"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-heatmap.svg assets/projects README.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update profile assets"
          git pull --rebase
          git push
