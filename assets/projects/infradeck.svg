<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="580" height="170" viewBox="0 0 580 170" role="img" aria-label="Infradeck: Self-hosted infrastructure monitoring with collectors, alerts and an AI incident agent.">
  <style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .in { animation: in .9s ease-out .2s both; }
    @keyframes in { from { opacity: 0 } to { opacity: 1 } }
    .tw { animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .9 } 50% { opacity: .2 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x=".5" y=".5" width="579" height="169" rx="10" fill="#05070a" stroke="#30363d"/>
  <line x1="0" y1="30" x2="580" y2="30" stroke="#30363d"/>
  <circle cx="18" cy="15" r="4.5" fill="none" stroke="#7d8590"/><circle cx="34" cy="15" r="4.5" fill="none" stroke="#7d8590"/><circle cx="50" cy="15" r="4.5" fill="none" stroke="#7d8590"/>
  <text x="290.0" y="19" text-anchor="middle" font-size="11" fill="#7d8590">~/projects/Infradeck</text>
  <text x="562" y="19" text-anchor="end" font-size="11" fill="#ff7b72">in development</text>
  <circle cx="546" cy="58" r="1.1" fill="#e6edf3" opacity=".6"/><circle class="tw" cx="522" cy="74" r="1.4" fill="#e6edf3"/><circle cx="556" cy="88" r=".8" fill="#e6edf3" opacity=".4"/>
  <g class="in">
    <text x="24" y="74" font-size="21" font-weight="700"><tspan fill="#ff7b72">❯ </tspan><tspan fill="#e6edf3">Infradeck</tspan></text>
    <text x="24" y="100" font-size="13" fill="#7d8590">Self-hosted infrastructure monitoring with collectors,</text><text x="24" y="119" font-size="13" fill="#7d8590">alerts and an AI incident agent.</text>
    <line x1="24" y1="136" x2="556" y2="136" stroke="#30363d" stroke-dasharray="2 4"/>
    <text x="24" y="157" font-size="12" fill="#7d8590">private repo</text><text x="556" y="157" font-size="12" fill="#ff7b72" text-anchor="end"><tspan class="tw">●</tspan> status: coming soon</text>
  </g>
</svg>