<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="end of transmission">
  <style>
    .tw { animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: 1 } 50% { opacity: .15 } }
    .gl { opacity: var(--o); animation: gl 5s ease-in-out infinite; }
    @keyframes gl { 0%,100% { opacity: var(--o) } 50% { opacity: calc(var(--o) * .35) } }

    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .cursor { animation: blink 1.1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .l1 { animation: show 1.2s ease-out 0.2s both; } .l2 { animation: show 1.4s ease-out 0.8s both; }
    .l3 { animation: show 1.2s ease-out 1.5s both; } .l4 { animation: show 1.2s ease-out 2.2s both; }
    @keyframes show { from { opacity: 0 } to { opacity: 1 } }
    .type { animation: type .7s steps(6) .4s both; }
    @keyframes type { from { width: 0 } to { width: 70px } }
    .spin { animation: spin 60s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
